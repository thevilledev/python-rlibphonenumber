# Builds the sdist and wheels, tests the wheels on native runners and, for a
# `v*` tag, publishes everything to PyPI with trusted publishing (OIDC, no API
# token). Run it manually (workflow_dispatch) for a dry run without publishing.
#
# Every platform gets an abi3 wheel (CPython >= 3.10) and a free-threaded
# CPython 3.14t wheel; abi3 does not cover free-threaded builds.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MATURIN_VERSION: v1.15.0

jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag, version and changelog agree
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          if ! grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated entry for $version"
            exit 1
          fi
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check that the sdist builds and imports
        run: |
          python -m pip install dist/*.tar.gz
          python -c "import rphonenumbers; print(rphonenumbers.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  linux:
    name: wheels (${{ matrix.platform.libc }}, ${{ matrix.platform.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { libc: manylinux, target: x86_64, manylinux: "2014" }
          - { libc: manylinux, target: aarch64, manylinux: "2014" }
          - { libc: musllinux, target: x86_64, manylinux: musllinux_1_2 }
          - { libc: musllinux, target: aarch64, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - name: Build free-threaded wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --compatibility pypi --out dist -i python3.14t
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.libc }}-${{ matrix.platform.target }}
          path: dist

  macos:
    name: wheels (macos, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-15, target: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - name: Build free-threaded wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist -i python3.14t
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    name: wheels (windows, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-2025, target: x64 }
          - { runner: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - name: Build free-threaded wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --locked --compatibility pypi --out dist -i python3.14t
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  # Installs the built wheels (never the sdist) and runs the full test suite,
  # including the differential tests against phonenumbers. The [test] extra
  # pins the matching phonenumbers release; the installed wheel satisfies the
  # rphonenumbers requirement itself.
  test:
    name: test (${{ matrix.runner }}, ${{ matrix.python }})
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, python: "3.10" }
          - { runner: ubuntu-24.04, python: "3.14t" }
          - { runner: ubuntu-24.04-arm, python: "3.14" }
          - { runner: ubuntu-24.04-arm, python: "3.14t" }
          - { runner: macos-15-intel, python: "3.14" }
          - { runner: macos-15, python: "3.10" }
          - { runner: macos-15, python: "3.14t" }
          - { runner: windows-2025, python: "3.10" }
          - { runner: windows-2025, python: "3.14t" }
          - { runner: windows-11-arm, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install the wheel
        run: |
          python -m pip install --only-binary=:all: --no-index --find-links dist rphonenumbers
          python -m pip install "rphonenumbers[test]"
      - run: python -m pytest -q

  test-musllinux:
    name: test (alpine, ${{ matrix.runner }})
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-musllinux-*
          merge-multiple: true
          path: dist
      - name: Run tests in an Alpine container
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.14-alpine sh -euc '
            pip install --only-binary=:all: --no-index --find-links dist rphonenumbers
            pip install "rphonenumbers[test]"
            python -m pytest -q -p no:cacheprovider
          '

  publish:
    name: publish to PyPI
    if: github.ref_type == 'tag'
    needs: [sdist, test, test-musllinux]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/rphonenumbers
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
